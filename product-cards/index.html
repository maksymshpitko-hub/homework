<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Product cards</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="cards">

    <article class="card card--orange">
      <div class="card__icon">🎧</div>
      <h2 class="card__title">Wireless Headphones</h2>
      <p class="card__price">$59.90</p>
      <p class="card__text">Deep bass, noise reduction and up to 30 hours of battery life.</p>
      <button class="card__btn" type="button">Buy now</button>
    </article>

    <article class="card card--teal">
      <div class="card__icon">⌚</div>
      <h2 class="card__title">Smart Watch</h2>
      <p class="card__price">$129.00</p>
      <p class="card__text">Tracks your steps, sleep and heart rate. Water resistant design.</p>
      <button class="card__btn" type="button">Buy now</button>
    </article>

    <article class="card card--rose">
      <div class="card__icon">🖱️</div>
      <h2 class="card__title">Gaming Mouse</h2>
      <p class="card__price">$34.50</p>
      <p class="card__text">Precise sensor, comfortable grip and customizable RGB lighting.</p>
      <button class="card__btn" type="button">Buy now</button>
    </article>

  </main>
</body>
</html>
